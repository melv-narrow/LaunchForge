[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launchforge"
version = "2.0.0"
description = "Async startup program manager with dependency graphs, health monitoring, and a system tray UI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["startup", "autostart", "asyncio", "windows", "launcher"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10.0"]
notify = ["plyer>=2.1"]
log = ["structlog>=24.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
all = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "plyer>=2.1",
    "structlog>=24.0",
]

[project.scripts]
launchforge = "launchforge.cli:main"

[project.urls]
Homepage = "https://github.com/melv-narrow/LaunchForge"
Repository = "https://github.com/melv-narrow/LaunchForge"
Issues = "https://github.com/melv-narrow/LaunchForge/issues"

[tool.setuptools.packages.find]
include = ["launchforge*"]

# ---------------------------------------------------------------------------
# Ruff linter / formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
